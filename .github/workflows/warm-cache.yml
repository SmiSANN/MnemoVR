name: Warm Cache

on:
  push:
    branches: [main]
    paths:
      - 'client/src-tauri/Cargo.lock'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  warm:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
          shared-key: "release"

      - name: Create .env
        working-directory: client
        shell: bash
        run: |
          echo "HMAC_SECRET=${{ secrets.HMAC_SECRET }}" > .env
          echo "SYNC_API_URL=${{ secrets.SYNC_API_URL }}" >> .env
          echo "VITE_SYNC_API_URL=${{ secrets.SYNC_API_URL }}" >> .env
          echo "DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}" >> .env

      - name: Install dependencies
        working-directory: client
        run: npm install

      - name: Warm Rust cache
        working-directory: client/src-tauri
        run: cargo build --release
        env:
          HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
          SYNC_API_URL: ${{ secrets.SYNC_API_URL }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
